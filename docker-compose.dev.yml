version: '3.8'

# ==============================================================================
# Sparky LMS - Development Docker Compose Override
# ==============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Enables live source-code bind mounting and local debugging tools.
# ==============================================================================

services:
  app:
    volumes:
      - .:/var/www/sparky-lms
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      SECURITY_KEY: ${SECURITY_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

  web:
    volumes:
      - .:/var/www/sparky-lms:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/sparky-routes.inc:/etc/nginx/conf.d/sparky-routes.inc:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
