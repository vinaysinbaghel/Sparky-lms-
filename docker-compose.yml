version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparky_app
    restart: unless-stopped
    volumes:
      - sparky_courses:/var/www/sparky-lms/app/courses
      - sparky_upload:/var/www/sparky-lms/app/upload
      - sparky_logs:/var/www/sparky-lms/app/logs
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sparky_lms}
      DB_USER: ${DB_USER:-sparky_user}
      DB_PASSWORD: ${DB_PASSWORD:?Error - DB_PASSWORD must be set in .env file}
      APP_HOST: ${APP_HOST:-localhost}
      SECURITY_KEY: ${SECURITY_KEY:?Error - SECURITY_KEY must be set in .env file}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Error - REDIS_PASSWORD must be set in .env file}
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(file_exists('/var/www/sparky-lms/index.php') ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: sparky_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - sparky_courses:/var/www/sparky-lms/app/courses:ro
      - sparky_upload:/var/www/sparky-lms/app/upload:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q --no-check-certificate https://localhost/ || wget --spider -q http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mariadb:11.4
    container_name: sparky_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Error - MYSQL_ROOT_PASSWORD must be set in .env file}
      MYSQL_DATABASE: ${DB_NAME:-sparky_lms}
      MYSQL_USER: ${DB_USER:-sparky_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Error - DB_PASSWORD must be set in .env file}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/sparky_clean_database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sparky_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Error - REDIS_PASSWORD must be set in .env file}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Error - REDIS_PASSWORD must be set in .env file}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
  redis_data:
  sparky_courses:
  sparky_upload:
  sparky_logs:
